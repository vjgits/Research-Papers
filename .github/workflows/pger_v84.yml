name: PGER V8.4 One-Time High-Recall Evidence Funnel
on:
  push:
    branches: [v84-recall-funnel-2026-10-27]
    paths:
      - 'v7-multihop/pger_v84_core.py'
      - 'v7-multihop/benchmark_v84.py'
      - 'v7-multihop/test_pger_v84.py'
      - '.github/workflows/pger_v84.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pger-v84-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fresh-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: v7-multihop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free CPU inference and datasets
        run: |
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'scikit-learn>=1.3,<2' 'pyarrow>=17,<27' 'pyahocorasick>=2,<4'
          python -m pip install 'torch>=2.3,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'sentence-transformers>=3.3,<6'
      - name: Run retrieval and 64-passage routing smoke tests
        run: |
          python -m unittest discover -s . -p 'test_pger_v84.py' -v
          python benchmark_v84.py smoke
      - name: Evaluate held-out public-validation cohorts and MoreHop context retrieval
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          TOKENIZERS_PARALLELISM: 'false'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python -u benchmark_v84.py run --datasets 2wiki musique morehop --out results-v84
      - name: Preserve positive or negative results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pger-v84-evidence-funnel
          path: v7-multihop/results-v84/
          if-no-files-found: warn
          retention-days: 30
