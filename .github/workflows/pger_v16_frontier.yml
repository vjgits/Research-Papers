name: PGER V16 One-Time Four-Round Evidence-Frontier Source Recovery
on:
  push:
    branches: [v16-adaptive-evidence-frontier-2026-10-28]
    paths:
      - 'v7-multihop/benchmark_v16_frontier.py'
      - '.github/workflows/pger_v16_frontier.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pger-v16-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frozen-primary-question-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: v7-multihop
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install basic open sparse evidence stack
        run: |
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'scikit-learn>=1.3,<2' 'pyarrow>=17,<27' 'pyahocorasick>=2,<4'
          python -m pip freeze > results-v16-dependencies.txt
      - name: Enforce three-system causal postmortem review first
        run: |
          python validate_three_system_review.py reviews/v14_failure_three_systems.json
          python -m unittest test_three_system_review_gate -v
      - name: Fail-closed proof invariant and new frontier algorithm smoke
        run: |
          python -m unittest test_pger_v13_proof_gate -v
          python benchmark_v16_frontier.py smoke
      - name: Frozen multi-pass source-fact retrieval on untouched question cohort
        run: python -u benchmark_v16_frontier.py run --out results-v16
      - name: Preserve full question-level chain-depth, actions, failures and index costs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pger-v16-adaptive-frontier-matched-four-passes
          path: |
            v7-multihop/results-v16/
            v7-multihop/results-v16-dependencies.txt
          if-no-files-found: warn
          retention-days: 30
