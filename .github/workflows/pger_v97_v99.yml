name: PGER V9.7–V9.9 One-Time Semantic Recovery, Routing and Reliability Trial
on:
  push:
    branches: [v97-semantic-recovery-and-gated-cost-2026-10-28]
    paths:
      - 'v7-multihop/benchmark_v97_v99.py'
      - '.github/workflows/pger_v97_v99.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pger-v97-v99-${{ github.ref }}
  cancel-in-progress: true
jobs:
  semantic-retrieval-and-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: v7-multihop
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install licensed open-weight semantic retriever
        run: |
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'scikit-learn>=1.3,<2' 'pyarrow>=17,<27' 'pyahocorasick>=2,<4'
          python -m pip install 'torch>=2.3,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'sentence-transformers>=5.4,<6'
          python -m pip freeze > results-v97-v99-dependencies.txt
      - name: Run smoke checks before benchmarks
        run: |
          python -m unittest discover -s . -p 'test_set_workspace_v95.py' -v
          python benchmark_v97_v99.py smoke
      - name: Run stages in locked sequence and archive decisions
        run: python -u benchmark_v97_v99.py run --out results-v97-v99
      - name: Preserve full question-level records and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pger-v97-v99-semantic-routing-reliability
          path: |
            v7-multihop/results-v97-v99/
            v7-multihop/results-v97-v99-dependencies.txt
          if-no-files-found: warn
          retention-days: 30
