name: PGER V17 Official SAG2 Offline Qwen Local H1 Feasibility (One Time)
on:
  push:
    branches: [v17-hover-official-sag2-reproduction-2026-10-28]
    paths:
      - 'v7-multihop/benchmark_v17_sag2_local.py'
      - '.github/workflows/pger_v17_official_sag2_local.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: v17-local-sag2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-original-sag2-local-reranker:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    defaults:
      run:
        working-directory: v7-multihop
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_ENABLE_HF_TRANSFER: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download same frozen label-blind HoVer corpus; no 2GB wiki redownload
        uses: actions/download-artifact@v4
        with:
          name: pger-v17-hover-shared-120-claim-corpus
          github-token: ${{ github.token }}
          run-id: 40741978291
          path: v7-multihop/v17-hover-data/prepared/
      - name: Clone original SAG2 code pinned exact author commit
        run: |
          git clone --quiet https://github.com/Zleap-AI/SAG-Benchmark.git sag-benchmark-v17
          cd sag-benchmark-v17
          git checkout --quiet bb7f82751ba1576219f9d9ebd021128603d130c3
          git rev-parse HEAD
      - name: Install official local Qwen backend and PGER sparse dependencies CPU-only
        run: |
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'scikit-learn>=1.3,<2' 'pyarrow>=17,<27' 'pyahocorasick>=2,<4'
          python -m pip install 'aiohttp>=3.9' 'jieba==0.42.1' 'pyuca==1.2' 'python-dotenv>=1.0' 'regex>=2024.0' 'tiktoken>=0.12'
          python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.51,<5' 'safetensors>=0.4' 'huggingface-hub>=0.34,<2' 'accelerate>=1,<2'
          python -m pip freeze > results-v17-local-deps.txt
      - name: Pin open Qwen3-Reranker-0.6B weights without any paid model provider
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          p=snapshot_download(repo_id="Qwen/Qwen3-Reranker-0.6B",revision="e61197ed45024b0ed8a2d74b80b4d909f1255473",local_dir="qwen-local-model",allow_patterns=["*.json","*.safetensors","*.model","*.jinja","tokenizer*","merges.txt","vocab.json","*.txt"])
          print("SAG2_QWEN_LOCAL_WEIGHTS",p)
          PY
      - name: Six balanced 2/3/4 hop actual SAG2 H1 iterative local reranker vs PGER
        run: python -u benchmark_v17_sag2_local.py --prepared v17-hover-data/prepared --out results-v17-sag2-local --upstream sag-benchmark-v17 --model-path qwen-local-model
      - name: Persist actual author-code local scores including partial case progress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pger-v17-official-sag2-local-qwen-6-claim-smoke
          path: |
            v7-multihop/results-v17-sag2-local/summary.json
            v7-multihop/results-v17-sag2-local/cases.jsonl
            v7-multihop/results-v17-local-deps.txt
          if-no-files-found: warn
          retention-days: 30
