name: PGER V9.1 One-Time Equal-Budget Real Question Gap-Test
on:
  push:
    branches: [v91-budgeted-proofgap-realqa-2026-10-28]
    paths:
      - 'v7-multihop/pger_v91_core.py'
      - 'v7-multihop/benchmark_v91.py'
      - 'v7-multihop/test_pger_v91.py'
      - '.github/workflows/pger_v91.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pger-v91-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lexical-gap-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: v7-multihop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free sparse retrieval dependencies
        run: |
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'scikit-learn>=1.3,<2' 'pyarrow>=17,<27' 'pyahocorasick>=2,<4'
      - name: Run V9.1 same-budget source unit tests
        run: |
          python -m unittest discover -s . -p 'test_pger_v91.py' -v
          python benchmark_v91.py smoke
      - name: Run frozen question-disjoint 2Wiki and MuSiQue evaluation
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python -u benchmark_v91.py run --datasets 2wiki musique --out results-v91
      - name: Save negative and positive per-question results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pger-v91-realqa-budget-results
          path: v7-multihop/results-v91/
          if-no-files-found: warn
          retention-days: 30
