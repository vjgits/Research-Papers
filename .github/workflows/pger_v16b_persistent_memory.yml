name: PGER V16B One-Time Persistent Evidence Memory and Cost-Gated Replication
on:
  push:
    branches: [v16b-persistent-evidence-archive-2026-10-28]
    paths:
      - 'v7-multihop/benchmark_v16_frontier.py'
      - '.github/workflows/pger_v16b_persistent_memory.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pger-v16b-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unseen-questions-monotone-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: v7-multihop
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install open baseline dependencies
        run: |
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'scikit-learn>=1.3,<2' 'pyarrow>=17,<27' 'pyahocorasick>=2,<4'
          python -m pip freeze > results-v16b-deps.txt
      - name: Industry three-system failure review and proof safety checks
        run: |
          python validate_three_system_review.py reviews/v14_failure_three_systems.json
          python -m unittest test_three_system_review_gate test_pger_v13_proof_gate -v
      - name: Assert monotone source-archive schema and quote-backed frontier 
        run: python benchmark_v16_frontier.py smoke
      - name: Run frozen first/second/fourth pass comparison on new 513 questions
        run: python -u benchmark_v16_frontier.py run --out results-v16b
      - name: Preserve all cases, active-source regressions and archive ceiling
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pger-v16b-source-archive-and-cost-gated-replication
          path: |
            v7-multihop/results-v16b/
            v7-multihop/results-v16b-deps.txt
          if-no-files-found: warn
          retention-days: 30
