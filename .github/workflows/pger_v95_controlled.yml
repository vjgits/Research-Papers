name: PGER V9.5 One-Time Controlled Lexical Set Workspace Benchmark
on:
  push:
    branches: [v95-controlled-set-benchmark-2026-10-28]
    paths:
      - 'v7-multihop/benchmark_v95_controlled.py'
      - '.github/workflows/pger_v95_controlled.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pger-v95-controlled-experiment
  cancel-in-progress: true
jobs:
  v95-locked-public-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: v7-multihop
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free sparse retrieval dependencies; no model calls
        run: |
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'scikit-learn>=1.3,<2' 'pyarrow>=17,<27' 'pyahocorasick>=2,<4'
          python -m pip freeze > results-v95-dependencies.txt
      - name: Check V9.5 deterministic workspace and benchmark
        run: |
          python -m unittest discover -s . -p 'test_set_workspace_v95.py' -v
          python benchmark_v95_controlled.py smoke
      - name: Predeclared two-call development and confirmation cohorts (no tuning)
        run: |
          python -u benchmark_v95_controlled.py run --datasets 2wikimultihopqa musique hotpotqa --data data/sag2_official --out results-v95-controlled
      - name: Archive all results including question-level failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pger-v95-locked-controlled-sets
          path: |
            v7-multihop/results-v95-controlled/
            v7-multihop/results-v95-dependencies.txt
          if-no-files-found: warn
          retention-days: 30
