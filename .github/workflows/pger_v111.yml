name: PGER V11.1 One-Time Development-Trained Source Reranker
on:
  push:
    branches: [v111-trained-candidate-reranker-2026-10-28]
    paths:
      - 'v7-multihop/benchmark_v111.py'
      - '.github/workflows/pger_v111.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pger-v111-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dev-trained-heldout-news-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: v7-multihop
    env:
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact dependency ranges, no paid calls
        run: |
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'scikit-learn>=1.3,<2' 'pyarrow>=17,<27' 'pyahocorasick>=2,<4'
          python -m pip freeze > results-v111-deps.txt
      - name: Check frozen supervised features and prior source identities
        run: |
          python benchmark_v111.py smoke
          python benchmark_v101_multihoprag.py smoke
      - name: Train on development only and score predeclared public confirmation
        run: python -u benchmark_v111.py run --out results-v111
      - name: Archive all individual cases including regressions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pger-v111-supervised-development-reranker
          path: |
            v7-multihop/results-v111/
            v7-multihop/results-v111-deps.txt
          if-no-files-found: warn
          retention-days: 30
