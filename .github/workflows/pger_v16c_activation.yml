name: PGER V16C One-Time Source-Archive Activation Test
on:
  push:
    branches: [v16c-archive-activation-2026-10-28]
    paths:
      - 'v7-multihop/benchmark_v16c_activation.py'
      - 'v7-multihop/benchmark_v16_frontier.py'
      - '.github/workflows/pger_v16c_activation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pger-v16c-${{ github.ref }}
  cancel-in-progress: true
jobs:
  two-stage-retrieval-activation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: v7-multihop
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned-range open CPU ranking stack
        run: |
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'scikit-learn>=1.3,<2' 'pyarrow>=17,<27' 'pyahocorasick>=2,<4'
          python -m pip freeze > results-v16c-deps.txt
      - name: Three architecture review and strict proof-invariant gates
        run: |
          python validate_three_system_review.py reviews/v14_failure_three_systems.json
          python -m unittest test_three_system_review_gate test_pger_v13_proof_gate -v
      - name: Frozen source-to-query archive activation and no-extra-search smoke
        run: |
          python benchmark_v16_frontier.py smoke
          python benchmark_v16c_activation.py smoke
      - name: Train on development question IDs and score other originally heldout IDs
        run: python -u benchmark_v16c_activation.py run --out results-v16c
      - name: Archive all errors, source traces, model cost and four-source failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pger-v16c-source-archive-trained-activation
          path: |
            v7-multihop/results-v16c/
            v7-multihop/results-v16c-deps.txt
          if-no-files-found: warn
          retention-days: 30
