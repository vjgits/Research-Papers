name: PGER V7.1 Exact SAG2 1000-Question Corpus Comparison (No Paid API)
on:
  push:
    branches: [v91-v71-vs-sag2-official-corpus-2026-10-28]
    paths:
      - 'v7-multihop/benchmark_v71_sag2_official.py'
      - '.github/workflows/pger_v71_sag2_official.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pger-v71-sag2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  official-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: v7-multihop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PGER original sparse graph dependencies
        run: |
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'scikit-learn>=1.3,<2' 'pyahocorasick>=2,<4'
          python -m pip freeze > results-v71-sag2-dependencies.txt
      - name: Verify unchanged V7.1 graph and canonical source adapter
        run: |
          python benchmark_v71_sag2_official.py smoke
      - name: Full 1000-question official release: 2Wiki MuSiQue HotpotQA
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python -u benchmark_v71_sag2_official.py run --datasets 2wikimultihopqa musique hotpotqa --out results-v71-sag2
      - name: Archive per-question results, source hashes and latency
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pger-v71-on-official-sag2-datasets
          path: |
            v7-multihop/results-v71-sag2/
            v7-multihop/results-v71-sag2-dependencies.txt
          if-no-files-found: warn
          retention-days: 30
