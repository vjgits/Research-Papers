name: PGER V10.1 One-Time MultiHop-RAG 2-4 Support-Document Transfer
on:
  push:
    branches: [v101-external-multihoprag-2to4-docs-2026-10-28]
    paths:
      - 'v7-multihop/benchmark_v101_multihoprag.py'
      - '.github/workflows/pger_v101_multihoprag.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pger-v101-external-${{ github.ref }}
  cancel-in-progress: true
jobs:
  multihoprag-external-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: v7-multihop
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install sparse licensed baseline dependencies
        run: |
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'scikit-learn>=1.3,<2' 'pyarrow>=17,<27' 'pyahocorasick>=2,<4'
          python -m pip freeze > results-v101-dependencies.txt
      - name: Verify source identity and existing workspace invariants
        run: |
          python benchmark_v101_multihoprag.py smoke
          python -m unittest discover -s . -p 'test_set_workspace_v95.py' -v
      - name: Frozen original news corpus 2/3/4-source comparative retrieval
        run: python -u benchmark_v101_multihoprag.py run --out results-v101
      - name: Preserve full per-question audit and negative results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pger-v101-multihoprag-external-evidence
          path: |
            v7-multihop/results-v101/
            v7-multihop/results-v101-dependencies.txt
          if-no-files-found: warn
          retention-days: 30
