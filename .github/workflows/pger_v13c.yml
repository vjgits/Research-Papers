name: PGER V13C One-Time Fail-Closed Evidence-Ledger Unit Gates
on:
  push:
    branches: [v13c-fail-closed-proof-ledger-2026-10-28]
    paths:
      - 'v7-multihop/pger_v13_proof_gate.py'
      - 'v7-multihop/test_pger_v13_proof_gate.py'
      - '.github/workflows/pger_v13c.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof-safety-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: v7-multihop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Simulated reviewer policy and abstention invariants
        run: python -m unittest test_pger_v13_proof_gate -v
      - name: Verify no trusted reviewer by default
        run: |
          python - <<'PY'
          from pger_v13_proof_gate import *
          q=[Claim("needs_relation","A","relates","B")]
          d=decide(q,{},[],0)
          assert d.status==Status.ABSTAIN
          assert d.proof_is_independently_verified is False
          print("V13C_DEFAULT_FAIL_CLOSED_PASS")
          PY
