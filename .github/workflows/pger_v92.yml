name: PGER V9.2 Finite Full-Corpus Evidence Expansion Ablations
on:
  push:
    branches: [v92-fullcorpus-evidence-expansion-2026-10-28]
    paths:
      - 'v7-multihop/expansion_v92.py'
      - 'v7-multihop/benchmark_v92.py'
      - 'v7-multihop/benchmark_v71_sag2_corpus.py'
      - 'v7-multihop/test_v92.py'
      - '.github/workflows/pger_v92.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pger-v92-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-fullcorpus-ablations:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: v7-multihop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install retrieval dependencies (no model APIs)
        run: |
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'scikit-learn>=1.3,<2' 'pyarrow>=17,<27' 'pyahocorasick>=2,<4'
      - name: Check source attribution and run short smoke
        run: |
          python -m unittest discover -s . -p 'test_v92.py' -v
          python benchmark_v92.py smoke
      - name: Predefined eight-arm development comparison, 120 per dataset
        run: python -u benchmark_v92.py run --start 0 --limit 120 --datasets 2wikimultihopqa musique hotpotqa --data data/sag2_official --out results-v92
      - name: Predefined unchanged-method confirmation on next 280 questions
        run: python -u benchmark_v92.py run --start 120 --limit 280 --datasets 2wikimultihopqa musique hotpotqa --data data/sag2_official --out results-v92
      - name: Preserve full per-question records, including regressions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pger-v92-full-corpus-bounded-ablations
          path: v7-multihop/results-v92/
          if-no-files-found: warn
          retention-days: 30
