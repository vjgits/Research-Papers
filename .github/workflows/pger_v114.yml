name: PGER V11.4 Frozen Boosted Reranker Replication
on:
  push:
    branches: [v114-frozen-boosted-confirmation-2026-10-28]
    paths:
      - 'v7-multihop/benchmark_v113.py'
      - '.github/workflows/pger_v114.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pger-v114-${{ github.ref }}
  cancel-in-progress: true
jobs:
  confirm-frozen-cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: v7-multihop
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen open dependencies
        run: |
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'scikit-learn>=1.3,<2' 'pyarrow>=17,<27' 'pyahocorasick>=2,<4'
          python -m pip freeze > results-v114-deps.txt
      - name: Confirm unchanged cache parity
        run: |
          python benchmark_v113.py smoke
          python benchmark_v101_multihoprag.py smoke
      - name: Train unchanged first 400 and test new 1600-1999
        run: python -u benchmark_v113.py run --out results-v114
      - name: Archive complete per-question evidence and negatives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pger-v114-frozen-boosted-new-cohort
          path: |
            v7-multihop/results-v114/
            v7-multihop/results-v114-deps.txt
          if-no-files-found: warn
          retention-days: 30
