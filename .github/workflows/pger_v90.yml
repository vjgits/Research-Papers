name: PGER V9.0 One-Time Proof-Gap and Generation-Budget Pilot
on:
  push:
    branches: [v90-decision-gap-budget-2026-10-28]
    paths:
      - 'v7-multihop/pger_v90_core.py'
      - 'v7-multihop/proof_gap_controller.py'
      - 'v7-multihop/benchmark_v90.py'
      - 'v7-multihop/test_pger_v90.py'
      - 'v7-multihop/test_proof_gap_controller.py'
      - '.github/workflows/pger_v90.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pger-v90-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fresh-source-generation-efficiency:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: v7-multihop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free CPU generation dependencies
        run: |
          python -m pip install 'numpy>=1.24,<3' 'transformers==4.52.4' 'safetensors'
          python -m pip install 'torch>=2.3,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip freeze > results-v90-dependencies.txt
      - name: Validate 14 proof-gap and selection tests, then smoke
        run: |
          python -m unittest discover -s . -p 'test_pger_v90.py' -v
          python -m unittest discover -s . -p 'test_proof_gap_controller.py' -v
          python benchmark_v90.py smoke
      - name: Frozen new-DocRED cohort generation-budget test
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          TOKENIZERS_PARALLELISM: 'false'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python -u benchmark_v90.py run --out results-v90
      - name: Retain all results and negative outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pger-v90-proofgap-budget-pilot
          path: |
            v7-multihop/results-v90/
            v7-multihop/results-v90-dependencies.txt
          if-no-files-found: warn
          retention-days: 30
