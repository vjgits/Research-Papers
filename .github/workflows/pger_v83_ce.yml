name: PGER V8.3 One-Time Open-Weight Cross-Encoder Ablation
on:
  push:
    branches: [v83-ce-provenance-2026-10-27]
    paths:
      - 'v7-multihop/pger_v83_semantic.py'
      - 'v7-multihop/benchmark_v83_semantic.py'
      - 'v7-multihop/test_pger_v83_semantic.py'
      - '.github/workflows/pger_v83_ce.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pger-v83-ce-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fresh-ce:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: v7-multihop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install open-weight CPU inference and retrieval requirements
        run: |
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'scikit-learn>=1.3,<2' 'pyarrow>=17,<27' 'pyahocorasick>=2,<4'
          python -m pip install 'torch>=2.3,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'sentence-transformers>=3.3,<6'
      - name: Unit tests for common candidate pools and provenance
        run: |
          python -m unittest discover -s . -p 'test_pger_v83_semantic.py' -v
          python benchmark_v83_semantic.py smoke
      - name: Frozen fresh-cohort semantic reranking evaluation
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          TOKENIZERS_PARALLELISM: 'false'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python -u benchmark_v83_semantic.py run --datasets 2wiki musique --out results-v83-semantic
      - name: Preserve all results and negative outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pger-v83-crossencoder-results
          path: v7-multihop/results-v83-semantic/
          if-no-files-found: warn
          retention-days: 30
