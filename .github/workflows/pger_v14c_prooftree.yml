name: PGER V14C One-Time EntailmentBank Held-Out Human Proof-Tree Retrieval
on:
  push:
    branches: [v14c-entailmentbank-heldout-retrieval-2026-10-28]
    paths:
      - 'v7-multihop/benchmark_v14c_prooftree.py'
      - '.github/workflows/pger_v14c_prooftree.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pger-v14c-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gold-proof-leaf-retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    defaults:
      run:
        working-directory: v7-multihop
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen CPU BM25 and boosted tree stack
        run: |
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'scikit-learn>=1.3,<2' 'pyarrow>=17,<27' 'pyahocorasick>=2,<4'
          python -m pip freeze > results-v14c-dependencies.txt
      - name: Pre-evaluation integrity checks and legacy feature parity
        run: |
          python benchmark_v14c_prooftree.py smoke
          python benchmark_v113.py smoke
          python -m unittest discover -s . -p 'test_pger_v13_proof_gate.py' -v
      - name: Train first 400 official science questions and score official validation and test
        run: python -u benchmark_v14c_prooftree.py run --out results-v14c
      - name: Preserve all proof-depth failures, source availability, cases and costs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pger-v14c-entailmentbank-heldout-prooftree-fact-retrieval
          path: |
            v7-multihop/results-v14c/
            v7-multihop/results-v14c-dependencies.txt
          if-no-files-found: warn
          retention-days: 30
