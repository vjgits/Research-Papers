name: PGER V9.6A One-Time Equal-Budget Evidence-Anchored Retrieval
on:
  push:
    branches: [v96-evidence-anchored-serial-probes-2026-10-28]
    paths:
      - 'v7-multihop/benchmark_v96.py'
      - '.github/workflows/pger_v96.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pger-v96-one-off-${{ github.ref }}
  cancel-in-progress: true
jobs:
  locked-two-query-candidate-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: v7-multihop
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free, sparse retrieval dependencies only
        run: |
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'scikit-learn>=1.3,<2' 'pyarrow>=17,<27' 'pyahocorasick>=2,<4'
          python -m pip freeze > results-v96-deps.txt
      - name: Verify unchanged workspace and new source-grounded query tests
        run: |
          python -m unittest discover -s . -p 'test_set_workspace_v95.py' -v
          python benchmark_v95_controlled.py smoke
          python benchmark_v96.py smoke
      - name: Frozen V9.6A 120-question development and new confirmation cohorts
        run: |
          python -u benchmark_v96.py run --datasets 2wikimultihopqa musique hotpotqa --data data/sag2_official --out results-v96
      - name: Archive all successes and negative results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pger-v96-source-anchored-two-query
          path: |
            v7-multihop/results-v96/
            v7-multihop/results-v96-deps.txt
          if-no-files-found: warn
          retention-days: 30
