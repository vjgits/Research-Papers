name: PGER V11.2 Fresh Question Replication (No Retuning)
on:
  push:
    branches: [v112-new-question-cohort-2026-10-28]
    paths:
      - 'v7-multihop/benchmark_v111.py'
      - '.github/workflows/pger_v112.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pger-v112-${{ github.ref }}
  cancel-in-progress: true
jobs:
  locked-replication:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: v7-multihop
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact public dependency ranges
        run: |
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'scikit-learn>=1.3,<2' 'pyarrow>=17,<27' 'pyahocorasick>=2,<4'
          python -m pip freeze > results-v112-dependencies.txt
      - name: Frozen invariant checks
        run: |
          python benchmark_v111.py smoke
          python benchmark_v101_multihoprag.py smoke
      - name: Train unchanged 0-399 and evaluate new questions 800-1199
        run: python -u benchmark_v111.py run --out results-v112
      - name: Archive all results and regressions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pger-v112-frozen-new-question-replication
          path: |
            v7-multihop/results-v112/
            v7-multihop/results-v112-dependencies.txt
          if-no-files-found: warn
          retention-days: 30
