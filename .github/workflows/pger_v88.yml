name: PGER V8.8 One-Time Open-Entity DocRED Extraction Experiment
on:
  push:
    branches: [v88-source-first-relation-2026-10-27]
    paths:
      - 'v7-multihop/pger_v88_core.py'
      - 'v7-multihop/benchmark_v88_docred.py'
      - 'v7-multihop/test_pger_v88.py'
      - '.github/workflows/pger_v88.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pger-v88-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-first:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: v7-multihop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free CPU inference and spaCy NER
        run: |
          python -m pip install 'numpy>=1.24,<3' 'spacy==3.8.11'
          python -m pip install 'https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl'
          python -m pip install 'torch>=2.3,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'sentence-transformers>=3.3,<6'
          python -c "import spacy; nlp=spacy.load('en_core_web_sm'); print('spaCy model',nlp.meta['version'])"
      - name: Run seven source/invariant unit tests and smoke
        run: |
          python -m unittest discover -s . -p 'test_pger_v88.py' -v
          python benchmark_v88_docred.py smoke
      - name: Run fixed V8.8 natural DocRED benchmark
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          TOKENIZERS_PARALLELISM: 'false'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python -u benchmark_v88_docred.py run --docs 60 --out results-v88
      - name: Preserve per-document metrics and all failed cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pger-v88-source-first-results
          path: v7-multihop/results-v88/
          if-no-files-found: warn
          retention-days: 30
