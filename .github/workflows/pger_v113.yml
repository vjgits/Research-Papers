name: PGER V11.3 One-Time Cached-Feature Efficient Reranker Comparison
on:
  push:
    branches: [v113-cached-efficient-rankers-2026-10-28]
    paths:
      - 'v7-multihop/benchmark_v113.py'
      - '.github/workflows/pger_v113.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pger-v113-${{ github.ref }}
  cancel-in-progress: true
jobs:
  new-cohort-efficient-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: v7-multihop
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen public sparse ML dependencies
        run: |
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'scikit-learn>=1.3,<2' 'pyarrow>=17,<27' 'pyahocorasick>=2,<4'
          python -m pip freeze > results-v113-deps.txt
      - name: Test cached features exact parity and source ID
        run: |
          python benchmark_v113.py smoke
          python benchmark_v101_multihoprag.py smoke
      - name: Train only 0-399 and score fresh 1200-1599
        run: python -u benchmark_v113.py run --out results-v113
      - name: Archive all outcomes and regressions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pger-v113-cached-efficiency-frontier
          path: |
            v7-multihop/results-v113/
            v7-multihop/results-v113-deps.txt
          if-no-files-found: warn
          retention-days: 30
