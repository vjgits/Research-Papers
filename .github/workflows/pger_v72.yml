name: PGER V7.2 One-Time Fresh Relation-Ledger Evaluation
on:
  push:
    branches: [v72-proof-gap-relation-ledger-2026-10-27]
    paths:
      - 'v7-multihop/benchmark_v72.py'
      - 'v7-multihop/pger_v72_core.py'
      - 'v7-multihop/test_pger_v72_core.py'
      - '.github/workflows/pger_v72.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: pger-v72-fresh-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fresh-cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: v7-multihop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install zero-API sparse retrieval dependencies
        run: |
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'scikit-learn>=1.3,<2' 'pyarrow>=17,<27' 'pyahocorasick>=2,<4'
      - name: Run provenance tests and smoke test
        run: |
          python -m unittest discover -s . -p 'test_pger_v72_core.py' -v
          python benchmark_v72.py smoke
      - name: Run fixed question-disjoint evaluation
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python -u benchmark_v72.py run --datasets 2wiki musique --out results-v72
      - name: Preserve full per-query evidence and scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pger-v72-fresh-retrieval
          path: v7-multihop/results-v72/
          if-no-files-found: warn
          retention-days: 30
