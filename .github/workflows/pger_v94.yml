name: PGER V9.4 Ettin-17M Efficient Source-Evidence Reranker
on:
  push:
    branches: [v94-efficient-ettin-evidence-ranker-2026-10-28]
    paths:
      - 'v7-multihop/benchmark_v94.py'
      - 'v7-multihop/test_v94.py'
      - '.github/workflows/pger_v94.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pger-v94-${{ github.ref }}
  cancel-in-progress: true
jobs:
  open-weight-model-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: v7-multihop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free CPU reranker stack
        run: |
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'scikit-learn>=1.3,<2' 'pyahocorasick>=2,<4' 'pyarrow>=17,<27'
          python -m pip install 'torch>=2.3,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'sentence-transformers>=5.4,<6'
          python -m pip freeze > results-v94-dependencies.txt
      - name: Assert model identity and same 64-pair budget
        run: |
          python -m unittest discover -s . -p 'test_v94.py' -v
          python benchmark_v94.py smoke
      - name: Frozen external-model-motivated development set
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          TOKENIZERS_PARALLELISM: 'false'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python -u benchmark_v94.py run --datasets musique 2wikimultihopqa --start 0 --limit 40 --out results-v94
      - name: Frozen additional 120 questions per dataset
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          TOKENIZERS_PARALLELISM: 'false'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python -u benchmark_v94.py run --datasets musique 2wikimultihopqa --start 40 --limit 120 --out results-v94
      - name: Archive all results with inferencing dependencies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pger-v94-ettin-efficient-reranker
          path: |
            v7-multihop/results-v94/
            v7-multihop/results-v94-dependencies.txt
          if-no-files-found: warn
          retention-days: 30
