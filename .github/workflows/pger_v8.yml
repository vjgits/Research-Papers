name: PGER V8 Fresh Candidate Rescue and Multi-hop Ablations
on:
  push:
    branches: [v8-adaptive-proofgap-2026-10-27]
    paths:
      - 'v7-multihop/pger_v8_core.py'
      - 'v7-multihop/benchmark_v8.py'
      - 'v7-multihop/test_pger_v8.py'
      - '.github/workflows/pger_v8.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pger-v8-fresh-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fresh-cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: v7-multihop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install zero-API sparse retrieval dependencies
        run: |
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'scikit-learn>=1.3,<2' 'pyarrow>=17,<27' 'pyahocorasick>=2,<4'
      - name: Test 8-hop dependencies and provenance
        run: |
          python -m unittest discover -s . -p 'test_pger_v8.py' -v
          python benchmark_v8.py smoke
      - name: Run fixed question-disjoint benchmark
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python -u benchmark_v8.py run --datasets 2wiki musique --out results-v8
      - name: Archive per-question evidence, latency, failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pger-v8-fresh-ablations
          path: v7-multihop/results-v8/
          if-no-files-found: warn
          retention-days: 30
