name: PGER V11 One-Time External Four-Source Facet-Witness Trial
on:
  push:
    branches: [v11-facet-witness-evidence-2026-10-28]
    paths:
      - 'v7-multihop/benchmark_v11.py'
      - '.github/workflows/pger_v11.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pger-v11-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fixed-corpus-facet-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: v7-multihop
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free sparse baseline stack
        run: |
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'scikit-learn>=1.3,<2' 'pyarrow>=17,<27' 'pyahocorasick>=2,<4'
          python -m pip freeze > results-v11-dependencies.txt
      - name: Run frozen invariant and witness checks
        run: |
          python benchmark_v11.py smoke
          python benchmark_v101_multihoprag.py smoke
          python -m unittest discover -s . -p 'test_set_workspace_v95.py' -v
      - name: Development and public confirmation under precommitted settings
        run: python -u benchmark_v11.py run --out results-v11
      - name: Preserve all successes and regression cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pger-v11-four-source-evidence-facets
          path: |
            v7-multihop/results-v11/
            v7-multihop/results-v11-dependencies.txt
          if-no-files-found: warn
          retention-days: 30
