name: PGER V10 Human-Verified MoreHopQA External Transfer and Source Blackout
on:
  push:
    branches: [v10-morehop-humanverified-missing-source-2026-10-28]
    paths:
      - 'v7-multihop/benchmark_v10_morehop.py'
      - '.github/workflows/pger_v10_morehop.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pger-v10-morehop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  independent-humanverified-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: v7-multihop
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic free retrieval dependencies
        run: |
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'scikit-learn>=1.3,<2' 'pyarrow>=17,<27' 'pyahocorasick>=2,<4'
          python -m pip freeze > results-v10-dependencies.txt
      - name: Verify MoreHopQA loader and prior workspace
        run: |
          python benchmark_v10_morehop.py smoke
          python -m unittest discover -s . -p 'test_set_workspace_v95.py' -v
      - name: Frozen untouched external dataset and source-blind blackout
        run: python -u benchmark_v10_morehop.py run --out results-v10
      - name: Archive all evidence including negative outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pger-v10-morehop-real-humanverified-missing-source
          path: |
            v7-multihop/results-v10/
            v7-multihop/results-v10-dependencies.txt
          if-no-files-found: warn
          retention-days: 30
