name: PGER V8.6 One-Time Typed Relation Entailment Experiment
on:
  push:
    branches: [v86-typed-entailment-2026-10-27]
    paths:
      - 'v7-multihop/pger_v86_relation.py'
      - 'v7-multihop/benchmark_v86.py'
      - 'v7-multihop/test_pger_v86.py'
      - 'v7-multihop/create_fixture_v86.py'
      - '.github/workflows/pger_v86.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pger-v86-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fixed-relation-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: v7-multihop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only free inference and retrieval
        run: |
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'scikit-learn>=1.3,<2' 'pyarrow>=17,<27' 'pyahocorasick>=2,<4'
          python -m pip install 'torch>=2.3,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'sentence-transformers>=3.3,<6'
      - name: Freeze deterministic 272-case fixture and check unit tests
        run: |
          python create_fixture_v86.py
          python -m unittest discover -s . -p 'test_pger_v86.py' -v
          python benchmark_v86.py smoke
      - name: Frozen relation challenge and fresh validation retrieval
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          TOKENIZERS_PARALLELISM: 'false'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python -u benchmark_v86.py run --datasets 2wiki musique --out results-v86
      - name: Preserve successes, failures and source-level diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pger-v86-typed-entailment-results
          path: v7-multihop/results-v86/
          if-no-files-found: warn
          retention-days: 30
