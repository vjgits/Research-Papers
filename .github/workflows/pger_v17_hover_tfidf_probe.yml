name: PGER V17 HoVer TFIDF Evidence Candidate Schema Probe
on:
  push:
    branches: [v17-hover-official-sag2-reproduction-2026-10-28]
    paths:
      - 'v7-multihop/probe_v17_tfidf.py'
      - '.github/workflows/pger_v17_hover_tfidf_probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe-tfidf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: v7-multihop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -u probe_v17_tfidf.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pger-v17-hover-original-first-stage-data
          path: v7-multihop/results-v17-hover-probe/dev_tfidf.json
          retention-days: 30
