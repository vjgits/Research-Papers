name: PGER V13B One-Time Independent HANS NLI Verifier Safety Gate
on:
  push:
    branches: [v13b-independent-nli-verifier-gate-2026-10-28]
    paths:
      - 'v7-multihop/benchmark_v13b_nli_safety.py'
      - '.github/workflows/pger_v13b.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pger-v13b-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hans-independent-entailment-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: v7-multihop
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install open weights and locked base evaluation libraries
        run: |
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'scikit-learn>=1.3,<2'
          python -m pip install 'torch>=2.3,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'sentence-transformers>=5.4,<6' 'huggingface-hub>=0.34,<2'
          python -m pip freeze > results-v13b-dependencies.txt
      - name: Test exact three-label mapping and known control behavior
        run: python benchmark_v13b_nli_safety.py smoke
      - name: Evaluate the pinned open NLI model on balanced HANS human labels
        run: python -u benchmark_v13b_nli_safety.py run --out results-v13b
      - name: Save label errors and model sha even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pger-v13b-hans-nli-verifier-safety-audit
          path: |
            v7-multihop/results-v13b/
            v7-multihop/results-v13b-dependencies.txt
          if-no-files-found: warn
          retention-days: 30
