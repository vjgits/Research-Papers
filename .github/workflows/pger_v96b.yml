name: PGER V9.6B One-Time Fixed-Pool Source-Witness Chains
on:
  push:
    branches: [v96b-source-witness-chain-assembly-2026-10-28]
    paths:
      - 'v7-multihop/benchmark_v96b.py'
      - '.github/workflows/pger_v96b.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pger-v96b-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fixed-pool-chain-selector:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: v7-multihop
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install open sparse dependencies
        run: |
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'scikit-learn>=1.3,<2' 'pyarrow>=17,<27' 'pyahocorasick>=2,<4'
          python -m pip freeze > results-v96b-dependencies.txt
      - name: Test existing workspace and source-witness prototype
        run: |
          python -m unittest discover -s . -p 'test_set_workspace_v95.py' -v
          python benchmark_v96b.py smoke
      - name: Run frozen development and additional public confirmation cohorts
        run: python -u benchmark_v96b.py run --datasets 2wikimultihopqa musique hotpotqa --out results-v96b
      - name: Preserve failures and source-witness traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pger-v96b-fixed-pool-result-archive
          path: |
            v7-multihop/results-v96b/
            v7-multihop/results-v96b-dependencies.txt
          if-no-files-found: warn
          retention-days: 30
