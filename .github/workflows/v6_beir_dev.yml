name: Stop V6.3 Reviewer Evaluations
on:
  push:
    branches: [v6-3-evidence-reviewers-2026-10-27]
    paths:
      - '.github/workflows/v6_beir_dev.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: truth-v63-dev-${{ github.ref }}
  cancel-in-progress: true
jobs:
  stop-only:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "Reviewer evaluation stopped on user request; no inference or dataset evaluation."
