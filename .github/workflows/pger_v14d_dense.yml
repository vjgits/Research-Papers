name: PGER V14D One-Time New-Domain Dense Recovery Exploratory Trial
on:
  push:
    branches: [v14d-science-dense-source-recovery-2026-10-28]
    paths:
      - 'v7-multihop/benchmark_v14d_dense.py'
      - '.github/workflows/pger_v14d_dense.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pger-v14d-${{ github.ref }}
  cancel-in-progress: true
jobs:
  science-semantic-source-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    defaults:
      run:
        working-directory: v7-multihop
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU BM25, boosted ranker and MIT dense retrieval model
        run: |
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'scikit-learn>=1.3,<2' 'pyarrow>=17,<27' 'pyahocorasick>=2,<4'
          python -m pip install 'torch>=2.3,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'sentence-transformers>=5.4,<6' 'huggingface-hub>=0.34,<2'
          python -m pip freeze > results-v14d-dependencies.txt
      - name: Frozen no-gold-query and source integrity smoke
        run: |
          python benchmark_v14d_dense.py smoke
          python benchmark_v14c_prooftree.py smoke
      - name: Experimental repeat on science proof trees after earlier V14C
        run: python -u benchmark_v14d_dense.py run --out results-v14d
      - name: Preserve all negative cases, source hashes and dense CPU cost
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pger-v14d-dense-science-proof-source-recovery
          path: |
            v7-multihop/results-v14d/
            v7-multihop/results-v14d-dependencies.txt
          if-no-files-found: warn
          retention-days: 30
